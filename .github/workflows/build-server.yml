name: Build Release Packages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or tag to build (defaults to the selected revision)
        required: false
        type: string

concurrency:
  group: release-packages-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      ref: ${{ steps.get_version.outputs.ref }}
      tag: ${{ steps.get_version.outputs.tag }}
      is_release: ${{ steps.get_version.outputs.is_release }}
    steps:
      - name: Determine source and package version
        id: get_version
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=""
          ref="$GITHUB_SHA"

          case "$GITHUB_EVENT_NAME" in
            release)
              tag="$RELEASE_TAG"
              ref="$tag"
              ;;
            push)
              ref="$GITHUB_REF"
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="${GITHUB_REF#refs/tags/}"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$DISPATCH_REF" ]]; then
                ref="$DISPATCH_REF"
                if [[ "$ref" == refs/tags/* ]]; then
                  tag="${ref#refs/tags/}"
                elif [[ "$ref" == v* ]]; then
                  tag="$ref"
                fi
              fi
              ;;
          esac

          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9] ]]; then
              echo "Release tags must begin with v followed by a digit (received: $tag)" >&2
              exit 1
            fi
            VERSION="${tag#v}"
            is_release=true
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            is_release=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  build-windows-installer:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: with-webui
            backend_only_define: 0
          - variant: backend-only
            backend_only_define: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Install Npcap build dependencies
        shell: pwsh
        run: |
          choco install npcap mingw --yes --no-progress
          $env:Path += ';C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          echo "PATH=$env:Path" >> $env:GITHUB_ENV

      - name: Build Windows binaries
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Arch "amd64" -Version "${{ needs.prepare.outputs.version }}"

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVERSION=${{ needs.prepare.outputs.version }} /DAPP_ARCH=amd64 /DBACKEND_ONLY=${{ matrix.backend_only_define }} scripts\windows_x86_64.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-installer-amd64-${{ matrix.variant }}
          path: scripts/Output/*_${{ matrix.variant }}_v*.exe

  build-debian-package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [with-webui, backend-only]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Configure ARM64 package sources
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^URIs: /i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          UBUNTU_CODENAME="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: $UBUNTU_CODENAME $UBUNTU_CODENAME-updates $UBUNTU_CODENAME-backports $UBUNTU_CODENAME-security
          Components: main universe restricted multiverse
          Architectures: arm64
          EOF

      - name: Install libpcap build dependencies
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libpcap-dev:arm64
          else
            sudo apt-get update
            sudo apt-get install -y libpcap-dev
          fi

      - name: Build Debian package
        run: |
          chmod +x scripts/build-deb.sh
          if [[ "${{ matrix.variant }}" == "backend-only" ]]; then
            scripts/build-deb.sh --without-webui "${{ matrix.arch }}" "${{ needs.prepare.outputs.version }}"
          else
            scripts/build-deb.sh "${{ matrix.arch }}" "${{ needs.prepare.outputs.version }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-deb-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/client/*.deb

  build-rpm-package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [with-webui, backend-only]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Configure ARM64 package sources
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^URIs: /i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          UBUNTU_CODENAME="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: $UBUNTU_CODENAME $UBUNTU_CODENAME-updates $UBUNTU_CODENAME-backports $UBUNTU_CODENAME-security
          Components: main universe restricted multiverse
          Architectures: arm64
          EOF

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo apt-get install -y rpm gcc-aarch64-linux-gnu libpcap-dev:arm64
          else
            sudo apt-get install -y rpm libpcap-dev
          fi

      - name: Build RPM package
        run: |
          chmod +x scripts/build-rpm.sh
          if [[ "${{ matrix.variant }}" == "backend-only" ]]; then
            scripts/build-rpm.sh --without-webui "${{ matrix.arch }}" "${{ needs.prepare.outputs.version }}"
          else
            scripts/build-rpm.sh "${{ matrix.arch }}" "${{ needs.prepare.outputs.version }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-rpm-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/client/*.rpm

  build-openwrt-package:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install IPK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Build OpenWrt IPK packages
        run: |
          chmod +x openwrt/build-ipk.sh
          VERSION="${{ needs.prepare.outputs.version }}" openwrt/build-ipk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-openwrt-ipk
          path: release/*.ipk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: needs.prepare.outputs.is_release == 'true'
    needs:
      - prepare
      - build-windows-installer
      - build-debian-package
      - build-rpm-package
      - build-openwrt-package
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          pattern: 'release-*'
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
